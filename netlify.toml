[build]
  command = "npm run build"
  publish = ".next"

[functions]
  # La extracción multimodal tarda 12-20 s; Netlify permite 60 s síncronos.
  # No fijar timeout: el valor de la plataforma (60 s) ya cubre el peor caso medido.

[[headers]]
  for = "/*"
  values = { X-Content-Type-Options = "nosniff", X-Frame-Options = "DENY", Referrer-Policy = "strict-origin-when-cross-origin" }
